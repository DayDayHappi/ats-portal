<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="ATS 本机测试结果归档、问题分类与原始日志查看。">
  <title>ATS · 测试归档</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="#runs" aria-label="ATS 测试归档首页"><span class="brand-mark">A<span></span></span><span><strong>ATS</strong><small>TEST ARCHIVE</small></span></a>
    <div class="workspace"><span class="workspace-icon">L</span><div>本地工作空间<small>LOCAL WORKSPACE</small></div></div>
    <div class="nav-label">测试分析</div>
    <nav aria-label="主导航">
      <a href="#runs" id="nav-runs"><span class="nav-icon">▤</span>测试记录</a>
      <a href="#issues" id="nav-issues"><span class="nav-icon">◇</span>问题视图</a>
    </nav>
    <div class="sidebar-bottom"><span class="connection-dot"></span><div>Ubuntu 本地服务<small>数据保存在本机</small></div><span class="version">v1.0</span></div>
  </aside>
  <div class="workspace-main">
    <header class="topbar"><div><span class="muted">工作空间</span><span class="crumb-sep">/</span><strong>ATS 测试归档</strong></div><div class="topbar-right"><span id="timezone-label">Asia/Shanghai</span><button class="icon-button" id="refresh" title="刷新数据" aria-label="刷新数据">↻</button><span class="avatar">AT</span></div></header>
    <main id="main" tabindex="-1"><div class="loading">正在连接本机服务…</div></main>
    <footer>ATS TEST ARCHIVE <span>·</span> 本地归档，原始记录可追溯</footer>
  </div>
  <dialog id="auth-dialog"><form id="auth-form"><div class="dialog-icon">⌑</div><h2>访问本机归档</h2><p>此服务已启用访问保护，请输入配置的访问凭据。</p><label>访问凭据<input name="token" type="password" autocomplete="current-password" required></label><p id="auth-error" class="error-text" role="alert"></p><button class="button primary" type="submit">连接工作空间</button></form></dialog>
  <dialog id="annotation-dialog"><div class="annotation-dialog"><div class="dialog-icon">◇</div><h2>根因标注</h2><p id="annotation-result-title" class="annotation-result-title"></p><p id="annotation-result-sub" class="annotation-result-sub"></p><fieldset class="annotation-field"><legend>选择根因标签（可多选）</legend><div id="annotation-labels" class="annotation-labels"></div><div class="annotation-new-label"><input id="annotation-new-label" type="text" maxlength="100" placeholder="新增标签名称"><button class="button soft" type="button" id="annotation-add-label">新增标签</button></div></fieldset><label class="annotation-field">根因说明（可选）<textarea id="annotation-note" maxlength="2000" rows="3" placeholder="补充具体原因…"></textarea></label><label class="annotation-field">标注人<input id="annotation-author" type="text" maxlength="100" placeholder="你的名字"></label><p id="annotation-error" class="error-text" role="alert"></p><div class="annotation-actions"><button class="button" type="button" id="annotation-delete" hidden>删除标注</button><span class="spacer"></span><button class="button" type="button" data-action="annotation-cancel">取消</button><button class="button primary" type="button" id="annotation-save">保存</button></div></div></dialog>
  <dialog id="meta-dialog"><div class="annotation-dialog"><div class="dialog-icon">⌘</div><h2>编辑设备 / 固件</h2><p class="annotation-result-sub">补充或修正本次运行的设备与固件信息；留空则回退到上传时记录的值。</p><label class="annotation-field">设备<input id="meta-device" type="text" maxlength="500" placeholder="如 EVB-01"></label><label class="annotation-field">固件<input id="meta-firmware" type="text" maxlength="500" placeholder="如 build-123"></label><label class="annotation-field">编辑人<input id="meta-author" type="text" maxlength="100" placeholder="你的名字"></label><p id="meta-error" class="error-text" role="alert"></p><div class="annotation-actions"><span class="spacer"></span><button class="button" type="button" data-action="meta-cancel">取消</button><button class="button primary" type="button" id="meta-save">保存</button></div></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
